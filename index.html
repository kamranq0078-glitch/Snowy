<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#d8e8ec"><title>A Little Kashmir</title><style>
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;font:15px system-ui;color:#405d62;background:linear-gradient(#ead2b2 0,#d3e5e8 52%,#f4f8f5)}.sun{position:absolute;right:17%;top:14%;width:65px;height:65px;border-radius:50%;background:#ffe7b6;box-shadow:0 0 36px #ffe3b67a}.mount{position:absolute;top:19%;height:40%;width:100%;background:#8eafb8;clip-path:polygon(0 72%,13% 25%,22% 56%,35% 0,47% 62%,61% 13%,73% 55%,85% 18%,100% 77%,100% 100%,0 100%)}.mount:after{content:"";position:absolute;inset:0;background:#f5f7f0;clip-path:polygon(13% 25%,16% 37%,13% 33%,10% 43%,35% 0,39% 24%,35% 19%,30% 34%,61% 13%,64% 30%,61% 25%,57% 42%,85% 18%,88% 34%,85% 28%,80% 43%)}.lake{position:absolute;top:53%;width:100%;height:16%;background:#afd0d5;border-radius:50% 50% 0 0}.boat{position:absolute;right:17%;top:38%;width:84px;height:25px;background:#806c5d;clip-path:polygon(0 43%,100% 43%,86% 100%,12% 100%,23% 0,78% 0,91% 43%)}.pine{position:absolute;bottom:24%;width:100px;height:190px;background:#2d584c;clip-path:polygon(50% 0,36% 22%,44% 22%,25% 45%,36% 44%,12% 72%,39% 70%,30% 100%,70% 100%,61% 70%,88% 72%,64% 44%,75% 45%,56% 22%,64% 22%);filter:drop-shadow(0 0 0 white)}.p1{left:-2%}.p2{right:1%;transform:scale(.8);transform-origin:bottom}.chinar{position:absolute;left:14%;bottom:25%;height:150px;width:130px;color:#725c4b;font-size:138px;line-height:1}.ground{position:absolute;inset:65% -6% -10%;border-radius:50% 50% 0 0;background:radial-gradient(ellipse at 50% 0,#fff,#e7f0f1)}.photo{position:absolute;z-index:4;top:20px;left:20px;width:84px;padding:5px;background:white;box-shadow:0 5px 18px #49646b55;transform:rotate(-5deg);cursor:pointer}.photo img{display:block;width:100%;height:96px;object-fit:cover;object-position:center 28%}.label{text-align:center;font-size:8px;color:#687f82;padding-top:4px}.person{position:absolute;z-index:2;bottom:19%;left:50%;transform:translateX(-50%);width:min(320px,72vw);height:min(410px,53vh);display:flex;flex-direction:column-reverse;align-items:center;justify-content:end;pointer-events:none}.ball{border-radius:50%;background:radial-gradient(circle at 35% 28%,white,#edf5f6 73%,#cadde1);box-shadow:inset -5px -7px 14px #bfD2d777,0 5px 12px #647f8630;transition:.35s cubic-bezier(.2,1.4,.4,1)}#b0{width:0;height:0}#b1{width:0;height:0;margin-bottom:-5px}#b2{width:0;height:0;margin-bottom:-5px}.face{position:absolute;bottom:55%;font-size:35px}.tools{position:absolute;z-index:5;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:30px;background:#fffaf0dd;box-shadow:0 7px 20px #45656a30;backdrop-filter:blur(8px)}button{border:0;border-radius:50%;width:46px;height:46px;background:white;color:#b87949;font-size:20px;box-shadow:0 3px 9px #45656a25;cursor:pointer;touch-action:manipulation}.ward{display:none;gap:5px}.ward button{color:#4c686a}.ward small{display:block;font-size:8px}.again{display:none}.hint{position:absolute;z-index:3;bottom:85px;left:50%;transform:translateX(-50%);white-space:nowrap;font:14px Georgia;color:#668084}.flakes{position:absolute;inset:0;z-index:1;pointer-events:none}.flake{position:absolute;top:-10px;color:white;opacity:.8;animation:snow linear infinite}@keyframes snow{to{transform:translate(15px,110vh)}}.pop{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:#233b478c;backdrop-filter:blur(5px)}.pop img{max-height:82vh;max-width:85vw;border:9px solid white;box-shadow:0 15px 40px #20353b66}@media(max-width:600px){.pine{width:76px;height:152px}.chinar{left:7%;font-size:110px}.person{width:76vw;height:45vh;bottom:20%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><div class="sun"></div><div class="mount"></div><div class="lake"><div class="boat"></div></div><div class="pine p1"></div><div class="pine p2"></div><div class="chinar">♧</div><div class="ground"></div><div class="flakes" id="flakes"></div><div class="photo" id="photo"><img alt="A winter memory in the snow" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDACgcHiMeGSgjISMtKygwPGRBPDc3PHtYXUlkkYCZlo+AjIqgtObDoKrarYqMyP/L2u71////m8H////6/+b9//j/2wBDASstLTw1PHZBQXb4pYyl+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj/wAARCAA8AC0DASIAAhEBAxEB/8QAGQAAAwEBAQAAAAAAAAAAAAAAAQMEAgUA/8QALBAAAgIBAwIDBwUAAAAAAAAAAQIAEQMEEiExUQVBgRMiJDJCYZEUIzM0cf/EABgBAQADAQAAAAAAAAAAAAAAAAIAAQME/8QAHBEAAgMAAwEAAAAAAAAAAAAAAAECERITMUEh/9oADAMBAAIRAxEAPwAjUZ1HvUfSaGV2ZgQLAmUI2jvc2pG9we8oQPbbTTD8QnUrtIBN1EZtz5KUbm6xdMWpl2sKsROKKUmVsKFiT5QQws9RKm4Qyfbvdt3NVBpl5QV4vjiKd/3G56mdL2St9Mk8RVcYRVVbPJMUVbopuiJtURmLrddvtMpmd8vJ/PaAqCpJhRVCggc/eacbDpDsmpyKa3jkX8sVkyMCDfLCzKsDLkrG2NGJHBrmO/SJQ349x/FQSjliTtF1yLxPEXxo4FhfmlQPPMVrW+Fb/RJHsL6OQTYP2ECk8CpvJwhgTgzo9B4dHw1AcTZD9RoekrKmI0YVdLjA7WZR6znbtmiFkEdYnWj4UnoLEoHMm8R/psexEidOyHMy/wAZnks7a6mLZjXXyjNExOrxL5bhNN/bDk7WNVRAtcgCb9Z7yuLyEq3u8XMhH//Z"><div class="label">a winter memory</div></div><div class="person"><div class="ball" id="b0"></div><div class="ball" id="b1"></div><div class="ball" id="b2"></div><div class="face" id="face"></div></div><div class="hint" id="hint">tap the snowflake to roll</div><div class="tools"><button id="roll" aria-label="Roll next snowball">❄</button><div class="ward" id="ward"><button data-x="☺|😊|😉">☺<small>face</small></button><button data-x="🧶|🎩|🧢">♧<small>hat</small></button><button data-x="🧣|❋|🧣">❋<small>scarf</small></button><button data-x="🪵|🧺">✳<small>arms</small></button></div><button class="again" id="again" aria-label="Build another snowman">↻</button></div><script>
let n=0;let b=[b0,b1,b2],sz=[170,126,86];roll.onclick=()=>{if(n>2)return;b[n].style.width=sz[n]+'px';b[n].style.height=sz[n]+'px';n++;if(n===3){roll.style.display='none';ward.style.display='flex';again.style.display='block';hint.textContent='dress your snow friend'} };document.querySelectorAll('[data-x]').forEach(q=>{let i=0;q.onclick=()=>{let a=q.dataset.x.split('|');face.textContent=a[i++%a.length];hint.textContent='tap to change his look'}});again.onclick=()=>{n=0;b.forEach(v=>{v.style.width='0';v.style.height='0'});face.textContent='';ward.style.display='none';again.style.display='none';roll.style.display='block';hint.textContent='tap the snowflake to roll'};photo.onclick=()=>{let p=document.createElement('div');p.className='pop';p.innerHTML='<img src="'+photo.querySelector('img').src+'" alt="Winter memory">';p.onclick=()=>p.remove();document.body.append(p)};for(let i=0;i<38;i++){let f=document.createElement('i');f.className='flake';f.textContent='•';f.style.left=Math.random()*100+'%';f.style.animationDuration=5+Math.random()*8+'s';f.style.animationDelay=-Math.random()*10+'s';flakes.append(f)}
</script></body></html>
