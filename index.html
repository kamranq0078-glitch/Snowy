<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#d8e8ec">
  <title>A Little Kashmir</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <main class="world" aria-label="Build a snowman in a Kashmir winter">
    <div class="sky"></div>
    <div class="sun"></div>
    <svg class="mountains" viewBox="0 0 1440 520" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <path class="far" d="M0 300 130 174 193 232 315 83 425 211 525 126 647 253 758 88 881 224 1016 107 1137 237 1264 139 1440 281V520H0Z"/>
      <path class="snowcap" d="m130 174 30 29-18-7 17 28 34 8-28-25 28 12-13-28 30 41-15-37 37 44-45-7-27-20-13 9-24-31Zm185-91 38 45-29-16 21 37 45 20-32-36 39 23-13-36 35 48-18-45 48 54-53-8-32-27-19 10-18-35Zm210 43 34 40-27-15 20 33 42 19-32-32 32 17-11-31 29 40-17-37 38 47-45-7-31-23-18 9-14-30Zm233-38 41 48-32-18 23 38 48 22-34-38 41 24-14-38 37 51-19-47 50 57-55-9-34-28-20 11-19-38Zm258 19 32 38-26-14 19 32 40 18-29-31 31 17-11-30 28 39-16-36 37 46-44-7-30-22-17 9-14-29Zm248-11 36 43-29-16 21 35 43 20-32-35 37 22-13-35 34 47-18-43 46 52-51-8-32-25-19 10-16-34Z"/>
      <path class="near" d="M0 365 123 267l86 47 121-105 97 113 133-71 109 96 140-123 105 91 123-85 115 98 94-68 194 110v150H0Z"/>
      <path class="near-snow" d="m123 267 28 23-20-6 18 24 34 12-27-22 30 13-12-23 30 34-44-6-22-15-15 5Zm207-58 32 30-24-8 20 27 38 14-29-27 32 13-13-26 32 37-47-7-25-18-17 7Zm230 42 28 24-21-7 17 22 33 13-25-22 28 11-11-21 27 31-41-6-22-15-14 6Zm245-32 33 29-25-7 21 25 38 14-29-26 32 12-13-25 32 35-47-6-26-18-16 7Zm228 0 29 25-22-6 18 23 34 12-26-22 29 11-12-22 28 32-42-6-23-16-14 6Zm209 31 29 26-22-7 18 23 35 13-27-23 29 12-12-23 28 33-43-6-23-17-14 6Z"/>
    </svg>
    <svg class="lake" viewBox="0 0 1440 220" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 54Q210 17 405 52T795 45t390 4 255 14v105H0Z" fill="#a9ced4"/>
      <path d="M0 94q150-15 300 0t300 0 300 0 300 0 240 0" fill="none" stroke="#eaf7f5" stroke-width="4" opacity=".65"/>
      <path d="M0 120q170-12 340 0t340 0 340 0 420 0" fill="none" stroke="#d7edf0" stroke-width="3" opacity=".7"/>
      <g class="houseboat" transform="translate(928 36)"><path d="M0 51h165l-20 23H22Z" fill="#705e58"/><path d="m27 50 8-24h99l12 24Z" fill="#a67f69"/><path d="m50 26 10-16h54l13 16Z" fill="#f0d8b6"/><path d="M68 10V1h27v9M39 38h16v12H39zm34 0h18v12H73zm32 0h18v12h-18Z" fill="#6d8a89"/><path d="M104 0q-5-11 2-18t0-13" fill="none" stroke="#fff" stroke-width="2" opacity=".7"/></g>
    </svg>
    <div class="forest" aria-hidden="true">
      <svg class="pine pine-a" viewBox="0 0 180 390"><path d="M87 390V94" stroke="#665a4c" stroke-width="12"/><path d="M91 20 26 138h35L7 220h53L0 304h160l-61-84h49l-53-82h36Z" fill="#234d43"/><path d="m91 20-19 55 20-13 23 16-14-36Zm-34 97 24 18 20-15 26 24 17 13H40Zm-31 82 39 20 25-22 37 24 24 12H9Z" fill="#eaf4f1" opacity=".9"/></svg>
      <svg class="pine pine-b" viewBox="0 0 180 390"><path d="M87 390V94" stroke="#665a4c" stroke-width="12"/><path d="M91 20 26 138h35L7 220h53L0 304h160l-61-84h49l-53-82h36Z" fill="#315c4e"/><path d="m91 20-19 55 20-13 23 16-14-36Zm-34 97 24 18 20-15 26 24 17 13H40Zm-31 82 39 20 25-22 37 24 24 12H9Z" fill="#edf7f2" opacity=".9"/></svg>
      <svg class="chinar" viewBox="0 0 260 390"><path d="M130 390V151m0 68L67 134m63 49 67-81M89 390l12-105m70 105-20-115M130 158 89 87m41 57 42-80M67 134l-29-7m29 7-8-32m132 0 27-14m-27 14 8-31" fill="none" stroke="#725b4b" stroke-width="9" stroke-linecap="round"/><g fill="#f3f8f4"><circle cx="38" cy="127" r="8"/><circle cx="61" cy="102" r="9"/><circle cx="172" cy="64" r="8"/><circle cx="199" cy="91" r="9"/><circle cx="88" cy="87" r="7"/><circle cx="171" cy="277" r="7"/></g></svg>
    </div>
    <div class="ground"><div class="drift drift-one"></div><div class="drift drift-two"></div></div>
    <canvas id="snow" aria-hidden="true"></canvas>

    <aside class="memory" aria-label="A winter memory">
      <button class="memory-photo" id="memoryButton" aria-label="Show the winter memory"><img src="winter-memory.jpeg" alt="A bundled-up winter moment in the snow"/><span class="photo-sparkle">✦</span></button>
      <span class="memory-label">a little winter memory</span>
    </aside>

    <section class="play-area" aria-label="Snowman workshop">
      <div class="snowman-wrap" id="snowmanWrap">
        <div class="sparkle-ring" id="sparkles"></div>
        <svg id="snowman" viewBox="0 0 360 480" role="img" aria-label="Your snowman in progress">
          <defs>
            <radialGradient id="snowball"><stop stop-color="#fff"/><stop offset=".78" stop-color="#f7fbfc"/><stop offset="1" stop-color="#dae8ed"/></radialGradient>
            <pattern id="shawl" width="28" height="24" patternUnits="userSpaceOnUse"><rect width="28" height="24" fill="#a7444d"/><path d="M14 3q8 7 0 15Q6 10 14 3Zm0 4v7m-5-4h10" fill="none" stroke="#f2d59a" stroke-width="1.6"/><circle cx="3" cy="4" r="1.2" fill="#f2d59a"/><circle cx="25" cy="20" r="1.2" fill="#f2d59a"/></pattern>
            <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <ellipse class="snow-shadow" cx="180" cy="440" rx="108" ry="19"/>
          <g class="arm-group" id="armGroup" style="display:none"><path d="M107 273 57 239l-23-31m219 65 50-34 21-32" fill="none" stroke="#805a40" stroke-width="8" stroke-linecap="round"/><path d="m34 208-14-19m14 19 20-17m-20 17-4 22m277-26 20-20m-20 20 20 16m-20-16-3 23" fill="none" stroke="#805a40" stroke-width="5" stroke-linecap="round"/><g id="kangri" style="display:none"><path d="m290 244 17-23 20 7 5 36-34 2Z" fill="#bd7951" stroke="#81563f" stroke-width="3"/><path d="m302 224 12-15 12 17" fill="none" stroke="#81563f" stroke-width="3"/><ellipse cx="311" cy="244" rx="10" ry="7" fill="#ffb654" class="ember"/></g></g>
          <circle id="base" cx="180" cy="354" r="0" fill="url(#snowball)" stroke="#d5e5ea" stroke-width="2" class="ball"/>
          <circle id="middle" cx="180" cy="260" r="0" fill="url(#snowball)" stroke="#d5e5ea" stroke-width="2" class="ball"/>
          <circle id="head" cx="180" cy="165" r="0" fill="url(#snowball)" stroke="#d5e5ea" stroke-width="2" class="ball"/>
          <g id="clothes" style="display:none">
            <path id="scarf" d="M126 216q54 23 108 0l-6 25q-48 21-96 0Z" fill="url(#shawl)" stroke="#a7444d" stroke-width="2"/>
            <path d="M205 234q18-4 23 5l-2 46q-15 9-27-1Z" fill="url(#shawl)" stroke="#a7444d" stroke-width="2"/>
            <g id="face"><circle cx="163" cy="159" r="5" fill="#343b3c"/><circle cx="198" cy="159" r="5" fill="#343b3c"/><path d="m174 169 27 8-25 10Z" fill="#e88e4e"/><path d="M164 183q17 20 35 0" fill="none" stroke="#64473d" stroke-width="3" stroke-linecap="round"/></g>
            <g id="hat"><path d="M145 132q35-50 70 0Z" fill="#415e75" stroke="#31495f" stroke-width="3"/><path d="M142 131h76v10h-76Z" fill="#a7444d"/><path d="M158 124q22 8 46 0" fill="none" stroke="#f2d59a" stroke-width="3"/></g>
          </g>
        </svg>
        <button class="part-hit hit-base" data-part="base" aria-label="Roll the snowman's base"></button>
        <button class="part-hit hit-middle" data-part="middle" aria-label="Roll the snowman's middle"></button>
        <button class="part-hit hit-head" data-part="head" aria-label="Roll the snowman's head"></button>
      </div>
      <div class="controls" id="controls" aria-label="Snowman controls">
        <div class="roll-control" id="rollControl"><span class="hint" id="hint">tap to roll</span><button id="rollButton" class="roll-button" aria-label="Roll snowball"><span class="roll-icon">❄</span></button><span class="roll-caption" id="caption">roll the first snowball</span></div>
        <div class="dress-controls" id="dressControls" hidden>
          <button class="dress-button" data-cycle="face">☺ <small>face</small></button><button class="dress-button" data-cycle="hat">♧ <small>hat</small></button><button class="dress-button" data-cycle="scarf">❋ <small>scarf</small></button><button class="dress-button" data-cycle="arms">✳ <small>arms</small></button><button class="again" id="again" aria-label="Start a new snowman">↻</button>
        </div>
      </div>
    </section>
    <button class="music-button" id="musicButton" type="button" aria-label="Open the Christmas song player" aria-expanded="false">♫<span>music</span></button>
    <aside class="music-panel" id="musicPanel" aria-label="Christmas music player" hidden>
      <div class="music-panel-heading"><span>V’s Christmas song</span><button id="musicClose" type="button" aria-label="Close music player">×</button></div>
      <iframe title="It’s Beginning To Look A Lot Like Christmas, cover by V of BTS" width="100%" height="166" scrolling="no" frameborder="0" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/bangtan/happy_holidays_army&amp;color=%23a7444d&amp;auto_play=false&amp;hide_related=true&amp;show_comments=false&amp;show_user=true&amp;show_reposts=false&amp;show_teaser=false&amp;visual=false"></iframe>
      <a class="music-credit" href="https://soundcloud.com/bangtan/happy_holidays_army" target="_blank" rel="noopener noreferrer">Official BTS SoundCloud stream</a>
    </aside>
    <div class="corner-kangri" aria-hidden="true"><span>☼</span></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="main.js"></script>
</body>
</html>
